{
 "name": "Gerar APK Android",
 "on": {
  "push": {
   "paths": [
    "ASHEN.zip"
   ]
  },
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "write"
 },
 "jobs": {
  "apk": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Extrair o jogo dentro do projeto Android",
     "run": "unzip -q ASHEN.zip -d build_src\ncd build_src/ASHEN\nmkdir -p android/app/src/main/assets/www\ncp -r index.html manifest.json styles assets src android/app/src/main/assets/www/"
    },
    {
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": "17"
     }
    },
    {
     "uses": "gradle/actions/setup-gradle@v4",
     "with": {
      "gradle-version": "8.7"
     }
    },
    {
     "name": "Compilar o APK",
     "run": "cd build_src/ASHEN/android\n# se o download falhar (rede instável), espera e tenta de novo\nfor i in 1 2 3; do gradle assembleDebug --no-daemon --info --stacktrace > build.log 2>&1 && break; echo \"tentativa $i falhou\"; grep -iE 'could not|failed|error' build.log | head -40; sleep 20; done\ntest -f app/build/outputs/apk/debug/app-debug.apk || { tail -80 build.log; exit 1; }\ncp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/ASHEN.apk"
    },
    {
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "ASHEN-apk",
      "path": "ASHEN.apk"
     }
    },
    {
     "uses": "softprops/action-gh-release@v2",
     "with": {
      "tag_name": "apk-${{ github.run_number }}",
      "name": "ASHEN APK #${{ github.run_number }}",
      "files": "ASHEN.apk",
      "make_latest": "true",
      "body": "Baixe ASHEN.apk no celular e toque para instalar (permita instalar de fontes desconhecidas)."
     }
    }
   ]
  }
 }
}
